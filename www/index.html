<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EGO AI</title>
<style>
:root{--bg:#faf7f2;--panel:#ffffff;--line:#e8e2d8;--v:#c2693f;--v2:#da8a5f;--text:#2b2621;--muted:#8a8178;--userbg:#f0e8dd}
:root[data-theme="dark"]{--bg:#1a1714;--panel:#211d19;--line:#3a332c;--v:#da8a5f;--v2:#e8a579;--text:#ece6dd;--muted:#9c9186;--userbg:#2a241e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header button.icon{position:relative;background:linear-gradient(160deg,#ffffff,#e4ddd0);border:1px solid #d8cfbe;color:#6b5f4d;border-radius:12px;width:38px;height:38px;font-size:16px;box-shadow:0 2px 5px #0000001a,inset 0 1px 1px #ffffffcc,inset 0 -2px 3px #00000014}
header button.icon::before{content:"";position:absolute;top:2px;left:5px;width:55%;height:35%;background:radial-gradient(ellipse,#ffffffaa,transparent 70%);border-radius:8px;pointer-events:none}
:root[data-theme="dark"] header button.icon{background:linear-gradient(160deg,#39322a,#211d18);border-color:#453d33;color:#e8ddc9}
#personaBtn{position:relative;background:linear-gradient(160deg,#ffffff,#e4ddd0)!important;border:1px solid #d8cfbe!important;border-radius:14px!important;box-shadow:0 2px 5px #0000001a,inset 0 1px 1px #ffffffcc,inset 0 -2px 3px #00000014}
:root[data-theme="dark"] #personaBtn{background:linear-gradient(160deg,#39322a,#211d18)!important;border-color:#453d33!important;color:#e8ddc9}
.htitle{flex:1}
.htitle h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px}
.htitle h1 span{color:var(--v)}
.htitle small{color:var(--muted);font-size:11px}
select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12px}
#layout{flex:1;display:flex;overflow:hidden;position:relative}
#side{width:230px;min-width:230px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px;transition:margin-left .2s}
#side.hidden{margin-left:-230px}
.chatitem{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:13px;margin-bottom:3px;cursor:pointer;color:var(--muted)}
.chatitem.active{background:var(--userbg);color:var(--text)}
.chatitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatitem button{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 4px}
#newchat{width:100%;background:linear-gradient(160deg,var(--v2),var(--v));color:#fff;border:1px solid var(--v);border-radius:14px;padding:11px;font-weight:600;font-size:13px;margin-bottom:12px;box-shadow:0 3px 8px #c2693f33,inset 0 1px 1px #ffffff55;position:relative}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:18px;max-width:720px;width:100%;margin:0 auto}
.msg{line-height:1.6;font-size:15.5px;word-wrap:break-word;max-width:100%}
.user{align-self:flex-end;max-width:82%;background:linear-gradient(160deg,var(--panel),var(--userbg));color:var(--text);padding:11px 16px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;box-shadow:0 2px 6px #0000000f,inset 0 1px 1px #ffffffaa;border:1px solid var(--line)}
.bot{align-self:stretch}
.bot p{margin:0 0 12px}.bot h2,.bot h3,.bot h4{margin:16px 0 8px;font-weight:600}
.bot ul,.bot ol{margin:0 0 12px;padding-left:22px}
.bot code{background:var(--userbg);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.bot a{color:var(--v)}
.bot img{max-width:100%;border-radius:12px;display:block;margin:8px 0}
.code{background:var(--bg);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden;box-shadow:0 2px 6px #0000000d}
.ch{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:5px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.ch button,.act button{background:none;border:0;color:var(--muted);font-size:12px;padding:4px 6px}
.code pre{margin:0;padding:12px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.act{display:flex;gap:4px;margin-top:4px}
.dots{color:var(--muted)}
.empty{margin:auto;text-align:center;color:var(--muted);width:100%;max-width:420px}
.empty b{display:block;color:var(--text);font-size:26px;font-weight:600;margin-bottom:20px}
.chip{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;background:linear-gradient(160deg,var(--panel),var(--userbg));border:1px solid var(--line);color:var(--text);border-radius:16px;padding:14px;font-size:14px;text-align:left;box-shadow:0 2px 6px #0000000f,inset 0 1px 1px #ffffffaa}
.chip .ic{font-size:18px;color:var(--v)}
.chip .tx{flex:1}
.chip .tx b{display:block;font-size:14px;font-weight:500}
.chip .tx small{color:var(--muted);font-size:12px}
form{display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--panel);max-width:720px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;max-height:130px;background:linear-gradient(160deg,var(--panel),var(--userbg));color:var(--text);border:1px solid var(--line);border-radius:22px;padding:12px 18px;font:inherit;font-size:15px;box-shadow:inset 0 1px 3px #0000000f,inset 0 1px 1px #ffffffaa}
#send{position:relative;background:linear-gradient(160deg,var(--v2),var(--v));color:#fff;border:1px solid var(--v);border-radius:50%;width:44px;height:44px;font-size:17px;box-shadow:0 3px 8px #c2693f55,inset 0 1px 1px #ffffff88,inset 0 -3px 5px #00000022;display:flex;align-items:center;justify-content:center}
#send::before{content:"";position:absolute;top:3px;left:7px;width:55%;height:35%;background:radial-gradient(ellipse,#ffffffbb,transparent 70%);border-radius:50%;pointer-events:none}
.toolbtn{position:relative;background:linear-gradient(160deg,#ffffff,#e4ddd0);border:1px solid #d8cfbe;color:#6b5f4d;border-radius:50%;width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px #0000001a,inset 0 1px 1px #ffffffcc,inset 0 -2px 3px #00000014}
.toolbtn svg{width:20px;height:20px;position:relative;z-index:1;filter:drop-shadow(0 1px 1px #0002)}
.toolbtn::before{content:"";position:absolute;top:3px;left:6px;width:60%;height:38%;background:radial-gradient(ellipse,#ffffffaa,transparent 70%);border-radius:50%;pointer-events:none}
:root[data-theme="dark"] .toolbtn{background:linear-gradient(160deg,#39322a,#211d18);border-color:#453d33;color:#e8ddc9}
.toolbtn.rec{background:linear-gradient(160deg,#ff8a7a,#d8432f);color:#fff;border-color:#d8432f;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e0525255}70%{box-shadow:0 0 0 10px #e0525200}100%{box-shadow:0 0 0 0 #e0525200}}
.thumb{max-width:220px;border-radius:14px;display:block;margin-top:6px}
.overlay{position:fixed;inset:0;background:#0006;display:none;z-index:5}
@media(max-width:640px){#side{position:absolute;top:0;bottom:0;left:0;z-index:10;height:100%}#side.hidden{margin-left:-230px}}

.pmitem{padding:10px 14px;font-size:13px;color:var(--text);cursor:pointer}
.pmitem:hover{background:var(--userbg)}
.pmitem.active{color:var(--v);font-weight:600}
</style>
</head>
<body>
<header>
<button class="icon" id="toggleSide" type="button">☰</button>
<div class="htitle"><h1>EGO <span>AI</span></h1><small>Tu mente, sin límites</small></div>
<div id="personaWrap" style="position:relative">
<button class="icon" id="personaBtn" type="button" style="width:auto;padding:6px 10px;font-size:12px;white-space:nowrap">Normal ▾</button>
<div id="personaMenu" style="display:none;position:absolute;right:0;top:40px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:20;min-width:140px;box-shadow:0 4px 18px #0004"></div>
</div>
<button class="icon" id="theme" type="button">☀️</button>
</header>
<div id="layout">
<div class="overlay" id="overlay"></div>
<div id="side">
<button id="newchat" type="button">+ Nuevo chat</button>
<div id="list"></div>
</div>
<div id="main">
<main id="chat"></main>
<form id="form">
<input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
<button class="toolbtn" id="camBtn" type="button" title="Tomar foto"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1-1.6A1 1 0 0 1 9.86 5h4.28a1 1 0 0 1 .86.4L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z" fill="currentColor"/><circle cx="12" cy="13" r="3.2" fill="var(--panel)"/></svg></button>
<button class="toolbtn" id="micBtn" type="button" title="Hablar"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<textarea id="input" rows="1" placeholder="Escribe tu mensaje... o /imagen / /buscar"></textarea>
<button id="send" type="submit">➤</button>
</form>
</div>
</div>
<script>
window.addEventListener('DOMContentLoaded', function(){
try{

const API="https://proud-glade-48c1.blackreynolds016.workers.dev";
const CREATED="6 de octubre de 2026";
const CREATOR="mi creador";
const BASE="Eres EGO AI, un asistente de nivel experto creado el "+CREATED+" por "+CREATOR+" usando Cloudflare Workers. Si te preguntan quién te creó o cuándo, responde con estos datos. Piensa con cuidado, verifica datos y lógica, y da respuestas completas y bien estructuradas (títulos, listas, código en bloques con lenguaje). Si algo es ambiguo, asume lo más razonable y dilo; si no sabes algo, dilo sin inventar. Responde en el idioma del usuario.";
const P={
normal:"",
dev:" Eres ingeniero senior: código limpio, probado mentalmente, explicado paso a paso, con casos límite.",
teacher:" Eres un profesor paciente: explica desde cero, con analogías y ejemplos, y comprueba comprensión.",
creative:" Eres creativo y original: ideas distintas, estilo vivo, varias opciones.",
direct:" Sé breve y directo: la respuesta primero, sin relleno.",
security:" Eres experto en ciberseguridad defensiva y educativa: explicas cómo funcionan las amenazas para que el usuario se proteja, cómo revisar y asegurar su propia red, router o dispositivos, buenas prácticas y conceptos de pentesting ético sobre sistemas propios o con autorización. No das instrucciones para atacar sistemas de terceros sin autorización ni creas malware."
};
const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send"),list=document.getElementById("list"),side=document.getElementById("side"),overlay=document.getElementById("overlay");
const personaBtn=document.getElementById("personaBtn"),personaMenu=document.getElementById("personaMenu");
const PLABEL={normal:"Normal",dev:"Programador",teacher:"Profesor",creative:"Creativo",direct:"Directo",security:"Seguridad"};
let busy=false,stop=false;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let chats=ld("ego_chats",null);
if(!chats){const old=ld("ego_h",[]);chats=old.length?[{id:Date.now(),title:old[0].content.slice(0,30),msgs:old}]:[]}
let curId=ld("ego_cur",chats[0]?chats[0].id:null);
let currentPersona=ld("ego_p","normal");
personaBtn.textContent=PLABEL[currentPersona]+" ▾";
Object.keys(PLABEL).forEach(key=>{
const it=document.createElement("div");
it.className="pmitem"+(key===currentPersona?" active":"");
it.textContent=PLABEL[key];
it.onclick=()=>{currentPersona=key;sv("ego_p",key);personaBtn.textContent=PLABEL[key]+" ▾";personaMenu.style.display="none";
personaMenu.querySelectorAll(".pmitem").forEach(x=>x.classList.remove("active"));it.classList.add("active")};
personaMenu.appendChild(it)});
personaBtn.onclick=()=>{personaMenu.style.display=personaMenu.style.display==="none"?"block":"none"};
document.addEventListener("click",e=>{if(!document.getElementById("personaWrap").contains(e.target))personaMenu.style.display="none"});
document.documentElement.setAttribute("data-theme",ld("ego_theme","light"));
document.getElementById("theme").textContent=ld("ego_theme","light")==="dark"?"☀️":"🌙";
function cur(){return chats.find(c=>c.id===curId)}
function saveChats(){sv("ego_chats",chats);sv("ego_cur",curId)}
function renderList(){list.innerHTML="";chats.slice().reverse().forEach(c=>{
const d=document.createElement("div");d.className="chatitem"+(c.id===curId?" active":"");
d.innerHTML='<span></span><button data-del="'+c.id+'">✕</button>';
d.querySelector("span").textContent=c.title||"Nuevo chat";
d.onclick=e=>{if(e.target.dataset.del)return;curId=c.id;saveChats();renderList();renderChat()};
d.querySelector("button").onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x.id!==c.id);if(curId===c.id)curId=chats[0]?chats[0].id:null;saveChats();renderList();renderChat()};
list.appendChild(d)})}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inl=t=>t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');
function md(src){
if((src.match(/```/g)||[]).length%2)src+="\n```";
const bl=[];
const s=esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{bl.push('<div class="code"><div class="ch"><span>'+(l||"código")+'</span><button class="cc" type="button">Copiar</button></div><pre>'+c+"</pre></div>");return"\u0000"+(bl.length-1)+"\u0000"});
const out=[];let listT=null;
const close=()=>{if(listT){out.push("</"+listT+">");listT=null}};const open=t=>{if(listT!==t){close();out.push("<"+t+">");listT=t}};
for(const line of s.split("\n")){let m;
if(m=line.match(/^\u0000(\d+)\u0000$/)){close();out.push(bl[m[1]])}
else if(m=line.match(/^(#{1,4})\s+(.*)/)){close();const n=m[1].length+1;out.push("<h"+n+">"+inl(m[2])+"</h"+n+">")}
else if(m=line.match(/^\s*[-*]\s+(.*)/)){open("ul");out.push("<li>"+inl(m[1])+"</li>")}
else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){open("ol");out.push("<li>"+inl(m[1])+"</li>")}
else if(!line.trim())close();
else{close();out.push("<p>"+inl(line)+"</p>")}}
close();return out.join("");}
const scroll=()=>{chat.scrollTop=chat.scrollHeight};
function bubble(role){const d=document.createElement("div");d.className="msg "+role;chat.appendChild(d);return d}
function finish(d,text,last){d.dataset.raw=text;d.innerHTML=md(text)+'<div class="act"><button data-a="copy" type="button">Copiar</button><button data-a="speak" type="button">🔊 Leer</button>'+(last?'<button data-a="regen" type="button">Regenerar</button>':"")+"</div>"}
let maleVoice=null;
function pickVoice(){
const voices=speechSynthesis.getVoices();
const es=voices.filter(v=>v.lang&&v.lang.startsWith("es"));
const pool=es.length?es:voices;
maleVoice=pool.find(v=>/male|hombre|varon|jorge|diego|carlos|pablo|miguel/i.test(v.name))||pool[0]||null;
}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function speak(text){
if(!("speechSynthesis" in window))return;
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text.replace(/[`*#_]/g,"").replace(/!\[.*?\]\(.*?\)/g,""));
if(maleVoice)u.voice=maleVoice;
u.pitch=0.85;u.rate=1;u.lang=maleVoice?maleVoice.lang:"es-ES";
speechSynthesis.speak(u)}
function renderChat(){chat.innerHTML="";const c=cur();
if(!c||!c.msgs.length){chat.innerHTML='<div class="empty"><b>¿En qué te ayudo?</b>'+
'<button class="chip"><span class="ic">✦</span><span class="tx"><b>Explícame algo difícil</b><small>de forma simple</small></span></button>'+
'<button class="chip"><span class="ic">&lt;/&gt;</span><span class="tx"><b>Escribe un código para...</b><small>o lo que necesites</small></span></button>'+
'<button class="chip"><span class="ic">◐</span><span class="tx"><b>/imagen un paisaje futuro</b><small>o una idea loca</small></span></button></div>';return}
c.msgs.forEach((m,i)=>{const d=bubble(m.role==="user"?"user":"bot");
if(m.role==="user"){
if(Array.isArray(m.content)){
const txt=m.content.find(p=>p.type==="text");
const img=m.content.find(p=>p.type==="image_url");
d.innerHTML=(txt?esc(txt.text):"Foto enviada")+(img?'<img class="thumb" src="'+img.image_url.url+'">':"");
}else{d.textContent=m.content}
}else{finish(d,m.content,i===c.msgs.length-1)}});scroll()}
document.getElementById("newchat").onclick=()=>{curId=null;renderList();renderChat();if(window.innerWidth<=640)toggleSide(true)};
function toggleSide(hide){if(hide===undefined)hide=!side.classList.contains("hidden");side.classList.toggle("hidden",hide);overlay.style.display=hide?"none":"block"}
document.getElementById("toggleSide").onclick=()=>toggleSide();
overlay.onclick=()=>toggleSide(true);
document.getElementById("theme").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);sv("ego_theme",t);document.getElementById("theme").textContent=t==="dark"?"☀️":"🌙"};
chat.addEventListener("click",e=>{const t=e.target.closest("[data-a],.chip,.cc");if(!t)return;
if(t.classList.contains("chip")){const txt=t.querySelector("b").textContent;input.value=txt;input.focus();return}
if(t.classList.contains("cc")){navigator.clipboard.writeText(t.closest(".code").querySelector("pre").textContent);t.textContent="Copiado";setTimeout(()=>t.textContent="Copiar",1200);return}
const a=t.dataset.a;if(!a||busy)return;
const msg=t.closest(".msg");
if(a==="copy"){navigator.clipboard.writeText(msg.dataset.raw);t.textContent="Copiado";setTimeout(()=>t.textContent="Copiar",1200)}
if(a==="speak"){speak(msg.dataset.raw)}
if(a==="regen"){const c=cur();c.msgs.pop();saveChats();msg.remove();ask()}});

const micBtn=document.getElementById("micBtn"),camBtn=document.getElementById("camBtn"),camInput=document.getElementById("camInput");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
const rec=new SR();rec.lang="es-ES";rec.interimResults=false;
rec.onresult=e=>{input.value=(input.value?input.value+" ":"")+e.results[0][0].transcript;input.dispatchEvent(new Event("input"))};
rec.onerror=()=>{micBtn.classList.remove("rec")};
rec.onend=()=>{micBtn.classList.remove("rec")};
micBtn.onclick=()=>{micBtn.classList.add("rec");try{rec.start()}catch(e){micBtn.classList.remove("rec")}};
}else{
micBtn.onclick=()=>alert("Tu Android no soporta reconocimiento de voz en esta vista.");
}
camBtn.onclick=()=>camInput.click();
camInput.onchange=()=>{
const file=camInput.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=async()=>{
const dataUrl=reader.result;
let c=cur();if(!c){c={id:Date.now(),title:"Foto",msgs:[]};chats.push(c);curId=c.id}
if(!chat.querySelector(".msg"))chat.innerHTML="";
const userMsg={role:"user",content:[
{type:"text",text:"Analiza esta imagen con detalle: describe qué ves y, si hay algún problema, error o duda visible, explícalo y ayúdame a resolverlo."},
{type:"image_url",image_url:{url:dataUrl}}
]};
c.msgs.push(userMsg);saveChats();renderList();
const ub=bubble("user");ub.innerHTML='Foto enviada<img class="thumb" src="'+dataUrl+'">';
await ask();
};
reader.readAsDataURL(file);
camInput.value="";
};
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=input.scrollHeight+"px"});
function typeOut(d,text){return new Promise(res=>{let i=0;const st=Math.max(3,Math.ceil(text.length/160));
const t=setInterval(()=>{if(stop)i=text.length;i=Math.min(text.length,i+st);d.innerHTML=md(text.slice(0,i));scroll();if(i>=text.length){clearInterval(t);res()}},18)})}
async function searchAndAsk(query,c,d){
let context="";
try{
const r=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(query)+"&format=json&no_html=1&skip_disambig=1");
const j=await r.json();
const parts=[];
if(j.AbstractText)parts.push(j.AbstractText);
if(j.RelatedTopics)j.RelatedTopics.slice(0,5).forEach(t=>{if(t.Text)parts.push(t.Text)});
context=parts.join("\n").slice(0,1500);
}catch(e){}
const prompt=context
?"Resultados de una búsqueda en internet sobre \""+query+"\":\n"+context+"\n\nCon base en esto, responde de forma clara y completa a: "+query
:"No obtuve resultados útiles de internet para \""+query+"\". Responde con tu mejor conocimiento, y dilo si la información puede no estar actualizada.";
busy=true;stop=false;send.textContent="■";
let reply=null;
try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"system",content:BASE+P[currentPersona]},{role:"user",content:prompt}]})});
reply=(await r.json()).reply}catch(e){}
if(reply===null){d.textContent="Sin conexión. Revisa tu internet e inténtalo de nuevo.";c.msgs.pop();saveChats()}
