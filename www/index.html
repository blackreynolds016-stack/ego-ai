const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

return t.replace(/\u0001(\d+)\u0001/g,(m,i)=>"<code>"+cs[+i]+"</code>")};
function md(src){
if((src.match(/```/g)||[]).length%2)src+="\n```";
const bl=[];
const s=esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{bl.push('<div class="code"><div class="ch"><span>'+(l||"código")+'</span><span class="cb">'+((/^(html|svg|xml)$/i.test(l)||/^\s*(&lt;!doctype html|&lt;html)/i.test(c))?'<button class="cr" type="button">▶ Ejecutar</button>':"")+'<button class="cc" type="button">Copiar</button></span></div><pre>'+c+"</pre></div>");return"\u0000"+(bl.length-1)+"\u0000"});
const out=[];let listT=null;
const close=()=>{if(listT){out.push("</"+listT+">");listT=null}};
const open=t=>{if(listT!==t){close();out.push("<"+t+">");listT=t}};
const lines=s.split("\n");
const cells=l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
for(let i=0;i<lines.length;i++){const line=lines[i];let m;
if(m=line.match(/^\u0000(\d+)\u0000$/)){close();out.push(bl[m[1]])}
else if(/^\s*\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])){close();
const head=cells(line);let h="<div class=\"tbl\"><table><thead><tr>"+head.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead><tbody>";i+=2;
while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){h+="<tr>"+cells(lines[i]).map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>";i++}
i--;out.push(h+"</tbody></table></div>")}
else if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){close();out.push("<hr>")}
else if(m=line.match(/^&gt;\s?(.*)/)){close();out.push("<blockquote>"+inl(m[1])+"</blockquote>")}
else if(m=line.match(/^(#{1,4})\s+(.*)/)){close();const n=m[1].length+1;out.push("<h"+n+">"+inl(m[2])+"</h"+n+">")}
else if(m=line.match(/^\s*[-*]\s+(.*)/)){open("ul");out.push("<li>"+inl(m[1])+"</li>")}else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){open("ol");out.push("<li>"+inl(m[1])+"</li>")}
else if(!line.trim())close();
else{close();out.push("<p>"+inl(line)+"</p>")}}
close();return out.join("");}

function shrink(dataUrl,cb){const im=new Image();im.onload=()=>{const mk=(max,q)=>{const k=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",q)};cb(mk(1024,0.8),mk(320,0.6))};im.onerror=()=>cb(dataUrl,dataUrl);im.src=dataUrl}

function handleFile(file){
if(!file)return;
const ext=(file.name.split(".").pop()||"").toLowerCase();
if(file.type.startsWith("image/")){
const reader=new FileReader();
reader.onload=()=>shrink(reader.result,(u,t)=>setAttachment(u,file.name,true,undefined,t));
reader.readAsDataURL(file);
return}
const readers={pdf:readPdf,docx:readDocx,xlsx:readXlsx,xls:readXlsx};
if(readers[ext]){
toast("Leyendo "+file.name+"…",8000);

const [app,auth,fs]=await Promise.all([import(FBU("app")),import(FBU("auth")),import(FBU("firestore"))]);
const a=app.initializeApp(FB_CFG);
this.fb={app,auth,fs,au:auth.getAuth(a),db:fs.getFirestore(a)};
return this.fb},
async init(){
if(!this.ready())return;
try{const f=await this.load();
f.auth.onAuthStateChanged(f.au,u=>{this.user=u;this.on=!!u;
sv("ego_user",u?{uid:u.uid,displayName:u.displayName||"",email:u.email||"",photoURL:u.photoURL||""}:null);
renderAcct();if(u)this.pull()})}catch(e){console.error(e)}},
async signIn(){
if(!this.ready()){toast("Falta configurar Firebase en la app");return}
const C=window.Capacitor;
if(!C||!C.isNativePlatform||!C.isNativePlatform()){toast("El inicio con Google solo funciona en la app instalada");return}
let r;
try{r=await nat("EgoGoogle","signIn",{clientId:GOOGLE_WEB_CLIENT_ID})}
catch(e){console.error(e);const m=String((e&&(e.message||e.code))||e);
if(/not implemented|not available|UNIMPLEMENTED/i.test(m))toast("Este APK no trae el inicio con Google. Vuelve a compilar la app");
else if(String(e&&e.code)==="10"){let inf=null;try{inf=await nat("EgoGoogle","info",{})}catch(x){}
toast("Error 10. Paquete: "+(inf&&inf.pkg||"?")+"\nSHA-1 de este APK:\n"+(inf&&inf.sha1||"?")+"\nWeb client: "+GOOGLE_WEB_CLIENT_ID.slice(0,22)+"...",20000)}
else if(/cancel/i.test(m))toast("Inicio de sesión cancelado");
else toast(m.slice(0,110));return}
try{const idToken=r&&r.idToken;if(!idToken)throw new Error("Google no devolvió el token");
const f=await this.load();
await f.auth.signInWithCredential(f.au,f.auth.GoogleAuthProvider.credential(idToken));
toast("Cuenta conectada")}catch(e){console.error(e);toast("Firebase rechazó el inicio: "+String((e&&(e.code||e.message))||e).slice(0,90))}},
async signOut(){
try{
if(!this.on||!this.fb){toast("Espera a que se conecte tu cuenta (necesita internet) e inténtalo de nuevo",4500);return}
clearTimeout(this.timer);await this.flush();
if(Object.keys(this.pending).length){toast("No se pudieron guardar tus chats en la nube. Revisa tu internet e inténtalo de nuevo",5000);return}
try{await nat("EgoGoogle","signOut",{})}catch(e){}
if(this.fb)await this.fb.auth.signOut(this.fb.au);
this.pending={};this.user=null;this.on=false;
sv("ego_user",null);
chats=[];curId=null;sv("ego_chats",[]);sv("ego_cur",null);Mem=[];sv("ego_mem",[]);updMem();
renderAcct();renderList();renderChat();
toast("Sesión cerrada. Tus chats quedan guardados en tu cuenta")
}catch(e){console.error(e);toast("No se pudo cerrar la sesión")}},
pack(c){
let m=c.msgs.map(x=>Array.isArray(x.content)?{role:x.role,content:((x.content.find(p=>p.type==="text")||{}).text||"")+" [imagen]"}:{role:x.role,content:noImg(x.content)});
let j=JSON.stringify(m);while(j.length>900000&&m.length>2){m.shift();j=JSON.stringify(m)}
return{title:c.title||"",updated:c.updated||Date.now(),msgs:j}},
queue(c){this.pending[c.id]=c;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1500)},
async flush(){
if(!this.fb||!this.user)return;
const items=Object.values(this.pending);this.pending={};
for(const c of items){try{await this.fb.fs.setDoc(this.fb.fs.doc(this.fb.db,"users",this.user.uid,"chats",String(c.id)),this.pack(c))}catch(e){console.error(e);this.pending[c.id]=c}}},
async remove(id){
if(!this.on||!this.fb)return;
try{await this.fb.fs.deleteDoc(this.fb.fs.doc(this.fb.db,"users",this.user.uid,"chats",String(id)))}catch(e){console.error(e)}},
async pull(){
if(!this.fb||!this.user)return;
try{const f=this.fb;
const snap=await f.fs.getDocs(f.fs.collection(f.db,"users",this.user.uid,"chats"));
const remote={};snap.forEach(d=>{remote[d.id]=d.data()});
let changed=false;
Object.keys(remote).forEach(id=>{const x=remote[id];let msgs;try{msgs=JSON.parse(x.msgs)}catch(e){return}
const l=chats.find(c=>String(c.id)===id);
if(!l){chats.push({id:Number(id)||id,title:x.title,msgs,updated:x.updated||0,n:msgs.length});changed=true}
else if((x.updated||0)>(l.updated||0)){l.title=x.title;l.msgs=msgs;l.updated=x.updated;l.n=msgs.length;changed=true}});
chats.forEach(c=>{const r=remote[String(c.id)];if(!r||(c.updated||0)>(r.updated||0))this.queue(c)});
if(changed){chats.sort((a,b)=>a.id-b.id);saveChats();renderList();if(!busy)renderChat()}
}catch(e){console.error(e);toast("No se pudo sincronizar")}}
});
function renderAcct(){
const u=Cloud.user;const sa=document.getElementById("sAv");if(sa){sa.innerHTML="";if(u&&u.photoURL){const im=document.createElement("img");im.src=u.photoURL;im.referrerPolicy="no-referrer";sa.appendChild(im)}else if(u)sa.textContent=((u.displayName||u.email||"?")[0]||"?").toUpperCase();else sa.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></svg>'}
const a=document.getElementById("acctBox");if(!a)return;a.innerHTML="";
if(u){
const row=document.createElement("div");row.className="urow";
const av=document.createElement("div");av.className="av";
if(u.photoURL){const im=document.createElement("img");im.src=u.photoURL;im.referrerPolicy="no-referrer";av.appendChild(im)}else av.textContent=((u.displayName||u.email||"?")[0]||"?").toUpperCase();
const info=document.createElement("div");info.className="uinfo";
const b=document.createElement("b");b.textContent=u.displayName||"Mi cuenta";
const sm=document.createElement("small");sm.textContent=u.email||"";
info.appendChild(b);info.appendChild(sm);row.appendChild(av);row.appendChild(info);a.appendChild(row);
const so=document.createElement("button");so.className="sbtn";so.type="button";so.textContent="Cerrar sesión";so.onclick=()=>{if(confirm("¿Cerrar sesión? Tus chats se quedan guardados en tu cuenta y vuelven a aparecer cuando entres de nuevo."))Cloud.signOut()};a.appendChild(so);
}else{
const g=document.createElement("button");g.className="gbtn";g.type="button";g.innerHTML=GSVG+"<span>Agregar cuenta de Google</span>";g.onclick=()=>Cloud.signIn();a.appendChild(g)}}
async function askPerms(){
const C=window.Capacitor;
try{
if(C&&C.Plugins&&C.Plugins.EgoNative){await C.Plugins.EgoNative.requestAll();toast("Acepta los permisos que pida Android")}
else if(C&&C.nativePromise){await C.nativePromise("EgoNative","requestAll",{});toast("Acepta los permisos que pida Android")}
else toast("Los permisos se piden en la app instalada")
}catch(e){console.error(e);toast("No se pudieron pedir los permisos")}}
Cloud.user=ld("ego_user",null);renderAcct();setTimeout(()=>Cloud.init(),400);
if(window.innerWidth>640){side.classList.remove("hidden")}
renderList();renderChat();
const curBars=()=>applyBars(document.documentElement.getAttribute("data-theme"));
curBars();setTimeout(curBars,400);setTimeout(curBars,1500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)curBars()});
requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.setAttribute("data-ready","1")})});

}catch(e){document.documentElement.setAttribute('data-ready','1');console.error('EGO AI init error:', e); document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif">Hubo un problema al cargar EGO AI. Cierra y abre la app de nuevo.<br><br>'+e.message+'</div>';}
});
</script>
