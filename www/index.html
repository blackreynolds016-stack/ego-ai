html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif}

.htitle{flex:1}
.htitle h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px}
.htitle h1 span{color:var(--v)}

select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12px}

.bot a{color:var(--v)}
.bot img{max-width:100%;border-radius:12px;display:block;margin:8px 0}
.code{background:var(--bg);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden;box-shadow:0 2px 6px #0000000d}

.act{display:flex;gap:4px;margin-top:4px}
.dots{color:var(--muted)}
.empty{margin:auto;text-align:center;color:var(--muted);width:100%;max-width:420px}
.empty b{display:block;color:var(--text);font-size:26px;font-weight:600;margin-bottom:20px}

#send::before{content:"";position:absolute;top:3px;left:7px;width:55%;height:35%;background:radial-gradient(ellipse,#ffffffbb,transparent 70%);border-radius:50%;pointer-events:none}
.toolbtn{position:relative;background:linear-gradient(160deg,#ffffff,#e4ddd0);border:1px solid #d8cfbe;color:#6b5f4d;border-radius:50%;width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px #0000001a,inset 0 1px 1px #ffffffcc,inset 0 -2px 3px #00000014}

.toolbtn::before{content:"";position:absolute;top:3px;left:6px;width:60%;height:38%;background:radial-gradient(ellipse,#ffffffaa,transparent 70%);border-radius:50%;pointer-events:none}

#attachPreview{display:none;align-items:center;gap:8px;padding:8px 12px;max-width:720px;width:100%;margin:0 auto}

.overlay{position:fixed;inset:0;background:#0006;display:none;z-index:5}
@media(max-width:640px){#side{position:absolute;top:0;bottom:0;left:0;z-index:10;height:100%}#side.hidden{margin-left:-230px}}

.pmitem{padding:10px 14px;font-size:13px;color:var(--text);cursor:pointer}
.pmitem:hover{background:var(--userbg)}
.pmitem.active{color:var(--v);font-weight:600}
#side{display:flex;flex-direction:column;overflow:hidden}
#newchat{flex-shrink:0}
#list{flex:1;overflow-y:auto;min-height:0}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:14px;padding:11px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .gbtn{background:#2a241e;color:var(--text);border-color:var(--line)}
.gbtn svg{width:18px;height:18px;flex-shrink:0}
.sbtn{width:100%;background:none;border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:9px;font-size:12px}
.urow{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--v);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.uinfo{flex:1;min-width:0}
.uinfo b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uinfo small{color:var(--muted);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;z-index:50;display:none;max-width:86%;text-align:center}
#chat{contain:content;overscroll-behavior:contain}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>

<script>
window.addEventListener('DOMContentLoaded', function(){
try{

const API="https://proud-glade-48c1.blackreynolds016.workers.dev";
const CREATED="6 de octubre de 2026";
const CREATOR="Ernesto Hernández";
const BASE="Tu nombre es EGO AI. Fuiste creado el "+CREATED+" por "+CREATOR+". Si te preguntan cómo te llamas, responde \"Me llamo EGO AI\". Menciona a tu creador y la fecha SOLO si te preguntan por tu origen. Resuelves tareas difíciles con conocimiento amplio. Responde en el idioma del usuario, claro y bien estructurado (títulos, listas, código en bloques con lenguaje). Verifica datos y lógica; si algo es ambiguo asume lo más razonable y dilo; si no sabes algo, dilo sin inventar. A un saludo responde en una frase corta.";

normal:"",
dev:" Eres ingeniero senior: código limpio, probado mentalmente, explicado paso a paso, con casos límite.",
teacher:" Eres un profesor paciente: explica desde cero, con analogías y ejemplos, y comprueba comprensión.",
creative:" Eres creativo y original: ideas distintas, estilo vivo, varias opciones.",
direct:" Sé breve y directo: la respuesta primero, sin relleno.",
security:" Eres experto en ciberseguridad defensiva y educativa: explicas cómo funcionan las amenazas para que el usuario se proteja, cómo revisar y asegurar su propia red, router o dispositivos, buenas prácticas y conceptos de pentesting ético sobre sistemas propios o con autorización. No das instrucciones para atacar sistemas de terceros sin autorización ni creas malware."
};
const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send"),list=document.getElementById("list"),side=document.getElementById("side"),overlay=document.getElementById("overlay");
const personaBtn=document.getElementById("personaBtn"),personaMenu=document.getElementById("personaMenu");
const PLABEL={normal:"Normal",dev:"Programador",teacher:"Profesor",creative:"Creativo",direct:"Directo",security:"Seguridad"};
let busy=false,stop=false;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let chats=ld("ego_chats",null);
if(!chats){const old=ld("ego_h",[]);chats=old.length?[{id:Date.now(),title:old[0].content.slice(0,30),msgs:old}]:[]}
let curId=null;
const Cloud={on:false,user:null,queue(){},remove(){}};
let currentPersona=ld("ego_p","normal");
personaBtn.textContent=PLABEL[currentPersona]+" ▾";
Object.keys(PLABEL).forEach(key=>{
const it=document.createElement("div");
it.className="pmitem"+(key===currentPersona?" active":"");
it.textContent=PLABEL[key];
it.onclick=()=>{currentPersona=key;sv("ego_p",key);personaBtn.textContent=PLABEL[key]+" ▾";personaMenu.style.display="none";
personaMenu.querySelectorAll(".pmitem").forEach(x=>x.classList.remove("active"));it.classList.add("active")};
personaMenu.appendChild(it)});
personaBtn.onclick=()=>{personaMenu.style.display=personaMenu.style.display==="none"?"block":"none"};
document.addEventListener("click",e=>{if(!document.getElementById("personaWrap").contains(e.target))personaMenu.style.display="none"});
const SYS=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";const TH0=ld("ego_theme",SYS);document.documentElement.setAttribute("data-theme",TH0);
document.getElementById("theme").textContent=TH0==="dark"?"☀️":"🌙";
function cur(){return chats.find(c=>c.id===curId)}
function persistable(){return chats.map(ch=>({...ch,msgs:ch.msgs.map(m=>(m.thumb&&Array.isArray(m.content))?{...m,content:m.content.map(p=>p.type==="image_url"?{type:"image_url",image_url:{url:m.thumb}}:p)}:m)}))}
function saveChats(){
const c=cur();let changed=false;
if(c&&c.msgs.length!==c.n){c.n=c.msgs.length;c.updated=Date.now();changed=true}
if(!sv("ego_chats",persistable())){
const last=c&&c.msgs[c.msgs.length-1];
chats.forEach(ch=>ch.msgs.forEach(m=>{if(m!==last&&Array.isArray(m.content)){m.content=((m.content.find(p=>p.type==="text")||{}).text||"")+" [imagen]";delete m.thumb}}));
sv("ego_chats",persistable())}
sv("ego_cur",curId);
if(changed&&c&&Cloud.on)Cloud.queue(c)}
function renderList(){list.innerHTML="";chats.slice().reverse().forEach(c=>{
const d=document.createElement("div");d.className="chatitem"+(c.id===curId?" active":"");
d.innerHTML='<span></span><button data-del="'+c.id+'">✕</button>';
d.querySelector("span").textContent=c.title||"Nuevo chat";
d.onclick=e=>{if(e.target.dataset.del)return;curId=c.id;saveChats();renderList();renderChat();if(window.innerWidth<=640)toggleSide(true)};
d.querySelector("button").onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x.id!==c.id);Cloud.remove(c.id);if(curId===c.id)curId=chats[0]?chats[0].id:null;saveChats();renderList();renderChat()};
list.appendChild(d)})}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const inl=t=>t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(src){
if((src.match(/```/g)||[]).length%2)src+="\n```";
const bl=[];
const s=esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{bl.push('<div class="code"><div class="ch"><span>'+(l||"código")+'</span><button class="cc" type="button">Copiar</button></div><pre>'+c+"</pre></div>");return"\u0000"+(bl.length-1)+"\u0000"});
const out=[];let listT=null;
const close=()=>{if(listT){out.push("</"+listT+">");listT=null}};
const open=t=>{if(listT!==t){close();out.push("<"+t+">");listT=t}};
for(const line of s.split("\n")){let m;
if(m=line.match(/^\u0000(\d+)\u0000$/)){close();out.push(bl[m[1]])}
else if(m=line.match(/^(#{1,4})\s+(.*)/)){close();const n=m[1].length+1;out.push("<h"+n+">"+inl(m[2])+"</h"+n+">")}
else if(m=line.match(/^\s*[-*]\s+(.*)/)){open("ul");out.push("<li>"+inl(m[1])+"</li>")}else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){open("ol");out.push("<li>"+inl(m[1])+"</li>")}
else if(!line.trim())close();
else{close();out.push("<p>"+inl(line)+"</p>")}}
close();return out.join("");}
const scroll=()=>{chat.scrollTop=chat.scrollHeight};
function bubble(role){const d=document.createElement("div");d.className="msg "+role;chat.appendChild(d);return d}
function finish(d,text,last){d.dataset.raw=text;d.innerHTML=md(text)+'<div class="act"><button data-a="copy" type="button">Copiar</button>'+(last&&!/^Imagen generada/.test(text)?'<button data-a="regen" type="button">Regenerar</button>':"")+"</div>"}
function renderChat(){chat.innerHTML="";const c=cur();
if(!c||!c.msgs.length){chat.innerHTML='<div class="empty"><b>¿En qué te ayudo?</b>'+
'<button class="chip"><span class="ic">✦</span><span class="tx"><b>Explícame algo difícil</b><small>de forma simple</small></span></button>'+
'<button class="chip"><span class="ic">&lt;/&gt;</span><span class="tx"><b>Escribe un código para...</b><small>o lo que necesites</small></span></button>'+
'<button class="chip"><span class="ic">◐</span><span class="tx"><b>/imagen un paisaje futuro</b><small>o una idea loca</small></span></button></div>';return}
c.msgs.forEach((m,i)=>{const d=bubble(m.role==="user"?"user":"bot");
if(m.role==="user"){
if(Array.isArray(m.content)){
const txt=m.content.find(p=>p.type==="text");
const img=m.content.find(p=>p.type==="image_url");
d.innerHTML=(txt?esc(txt.text):"Foto enviada")+(img?'<img class="thumb" src="'+img.image_url.url+'">':"");
}else{d.textContent=m.content}
}else{finish(d,m.content,i===c.msgs.length-1)}});scroll()}
document.getElementById("newchat").onclick=()=>{curId=null;renderList();renderChat();if(window.innerWidth<=640)toggleSide(true)};
function toggleSide(hide){if(hide===undefined)hide=!side.classList.contains("hidden");side.classList.toggle("hidden",hide);overlay.style.display=(!hide&&window.innerWidth<=640)?"block":"none"}
document.getElementById("toggleSide").onclick=()=>toggleSide();
overlay.onclick=()=>toggleSide(true);

const attachPreview=document.getElementById("attachPreview"),attachPreviewImg=document.getElementById("attachPreviewImg"),attachPreviewName=document.getElementById("attachPreviewName"),attachPreviewRemove=document.getElementById("attachPreviewRemove");
let pendingAttachment=null;
function shrink(dataUrl,cb){const im=new Image();im.onload=()=>{const mk=(max,q)=>{const k=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",q)};cb(mk(1024,0.8),mk(320,0.6))};im.onerror=()=>cb(dataUrl,dataUrl);im.src=dataUrl}
function setAttachment(dataUrl,name,isImage,rawText,thumb){
pendingAttachment={dataUrl,name,isImage,rawText,thumb};
attachPreview.style.display="flex";
attachPreviewImg.style.display=isImage?"block":"none";
if(isImage)attachPreviewImg.src=dataUrl;
attachPreviewName.textContent=name;
input.focus();}
attachPreviewRemove.onclick=()=>{pendingAttachment=null;attachPreview.style.display="none"};
fileBtn.onclick=()=>fileInput.click();
fileInput.onchange=()=>{
const file=fileInput.files[0];if(!file)return;
if(file.type.startsWith("image/")){
const reader=new FileReader();
reader.onload=()=>shrink(reader.result,(u,t)=>setAttachment(u,file.name,true,undefined,t));
reader.readAsDataURL(file);
}else{
const reader=new FileReader();
reader.onload=()=>setAttachment(null,file.name,false,String(reader.result).slice(0,12000));
reader.readAsText(file);
}
fileInput.value="";
};
camBtn.onclick=()=>camInput.click();
camInput.onchange=()=>{
const file=camInput.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=()=>shrink(reader.result,(u,t)=>setAttachment(u,"Foto",true,undefined,t));
reader.readAsDataURL(file);
camInput.value="";
};

const GREET=/^[\s\u00a1!\u00bf]*(hola+|holi+|ola|buenas|buen[oa]s\s+(d[ií]as|tardes|noches)|hey+|hi|hello|qu[eé]\s+tal|saludos)[\s!¡.?¿,]*$/i;

let ctrl=null;
async function callAPI(messages){
ctrl=new AbortController();const tm=setTimeout(()=>{if(ctrl)ctrl.abort()},60000);
try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages}),signal:ctrl.signal});
if(!r.ok)return null;
const j=await r.json();
return typeof j.reply==="string"&&j.reply.trim()?j.reply:null}catch(e){return null}finally{clearTimeout(tm);ctrl=null}}
function apiHistory(c){const a=c.msgs.slice(-14);
return a.map((m,i)=>{if(Array.isArray(m.content))return i<a.length-1?{role:m.role,content:((m.content.find(p=>p.type==="text")||{}).text||"")+" [imagen omitida]"}:{role:m.role,content:m.content};const t=m.content;return{role:m.role,content:t.length>3000?t.slice(0,3000)+"…":t}})}
async function deliver(d,c,reply){
if(reply===null){d.dataset.err="1";d.textContent=stop?"Respuesta detenida.":"No se pudo obtener respuesta. Revisa tu internet e inténtalo de nuevo.";
d.insertAdjacentHTML("beforeend",'<div class="act"><button data-a="regen" type="button">Reintentar</button></div>')}
else{await typeOut(d,reply);c.msgs.push({role:"assistant",content:reply});saveChats();finish(d,reply,true)}
busy=false;stop=false;send.textContent="➤";scroll()}
async function searchAndAsk(query,c,d){
busy=true;stop=false;send.textContent="■";
let context="";
try{
ctrl=new AbortController();
const r=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(query)+"&format=json&no_html=1&skip_disambig=1",{signal:ctrl.signal});
const j=await r.json();
const parts=[];
if(j.AbstractText)parts.push(j.AbstractText);
if(j.RelatedTopics)j.RelatedTopics.slice(0,5).forEach(t=>{if(t.Text)parts.push(t.Text)});
context=parts.join("\n").slice(0,1500);
}catch(e){}
ctrl=null;
if(stop){await deliver(d,c,null);return}
const prompt=context
?"Resultados de una búsqueda en internet sobre \""+query+"\":\n"+context+"\n\nCon base en esto, responde de forma clara y completa a: "+query
:"No obtuve resultados útiles de internet para \""+query+"\". Responde con tu mejor conocimiento, y dilo si la información puede no estar actualizada.";
const reply=await callAPI([{role:"system",content:BASE+P[currentPersona]},{role:"user",content:prompt}]);
await deliver(d,c,reply)}

const GOOGLE_WEB_CLIENT_ID="649221423570-vk2dcrni2ruc3u0pvneca14s0gj00j7b.apps.googleusercontent.com";
function nat(plugin,method,args){const C=window.Capacitor;
if(C&&C.Plugins&&C.Plugins[plugin]&&typeof C.Plugins[plugin][method]==="function")return C.Plugins[plugin][method](args||{});
if(C&&C.nativePromise)return C.nativePromise(plugin,method,args||{});
return Promise.reject(new Error("not available"))}
const FBU=n=>"https://www.gstatic.com/firebasejs/10.14.1/firebase-"+n+".js";
Object.assign(Cloud,{
timer:null,pending:{},fb:null,
ready(){return !!(FB_CFG.apiKey&&FB_CFG.projectId&&FB_CFG.appId)},
async load(){
if(this.fb)return this.fb;
const [app,auth,fs]=await Promise.all([import(FBU("app")),import(FBU("auth")),import(FBU("firestore"))]);
const a=app.initializeApp(FB_CFG);
this.fb={app,auth,fs,au:auth.getAuth(a),db:fs.getFirestore(a)};
return this.fb},
async init(){
if(!this.ready())return;
try{const f=await this.load();
f.auth.onAuthStateChanged(f.au,u=>{this.user=u;this.on=!!u;renderAcct();if(u)this.pull()})}catch(e){console.error(e)}},
async signIn(){
if(!this.ready()){toast("Falta configurar Firebase en la app");return}
const C=window.Capacitor;
if(!C||!C.isNativePlatform||!C.isNativePlatform()){toast("El inicio con Google solo funciona en la app instalada");return}
let r;
try{r=await nat("EgoGoogle","signIn",{clientId:GOOGLE_WEB_CLIENT_ID})}
catch(e){console.error(e);const m=String((e&&(e.message||e.code))||e);
if(/not implemented|not available|UNIMPLEMENTED/i.test(m))toast("Este APK no trae el inicio con Google. Vuelve a compilar la app");
else if(/cancel/i.test(m))toast("Inicio de sesión cancelado");
else toast(m.slice(0,110));return}
try{const idToken=r&&r.idToken;if(!idToken)throw new Error("Google no devolvió el token");
const f=await this.load();
await f.auth.signInWithCredential(f.au,f.auth.GoogleAuthProvider.credential(idToken));
toast("Cuenta conectada")}catch(e){console.error(e);toast("Firebase rechazó el inicio: "+String((e&&(e.code||e.message))||e).slice(0,90))}},
async signOut(){
try{try{await nat("EgoGoogle","signOut",{})}catch(e){}
if(this.fb)await this.fb.auth.signOut(this.fb.au);toast("Sesión cerrada")}catch(e){console.error(e)}},
pack(c){
let m=c.msgs.map(x=>Array.isArray(x.content)?{role:x.role,content:((x.content.find(p=>p.type==="text")||{}).text||"")+" [imagen]"}:{role:x.role,content:x.content});
let j=JSON.stringify(m);while(j.length>900000&&m.length>2){m.shift();j=JSON.stringify(m)}
return{title:c.title||"",updated:c.updated||Date.now(),msgs:j}},
queue(c){this.pending[c.id]=c;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1500)},
async flush(){
if(!this.fb||!this.user)return;
const items=Object.values(this.pending);this.pending={};
for(const c of items){try{await this.fb.fs.setDoc(this.fb.fs.doc(this.fb.db,"users",this.user.uid,"chats",String(c.id)),this.pack(c))}catch(e){console.error(e);this.pending[c.id]=c}}},
async remove(id){
if(!this.on||!this.fb)return;
try{await this.fb.fs.deleteDoc(this.fb.fs.doc(this.fb.db,"users",this.user.uid,"chats",String(id)))}catch(e){console.error(e)}},
async pull(){
if(!this.fb||!this.user)return;
try{const f=this.fb;
const snap=await f.fs.getDocs(f.fs.collection(f.db,"users",this.user.uid,"chats"));
const remote={};snap.forEach(d=>{remote[d.id]=d.data()});
let changed=false;
Object.keys(remote).forEach(id=>{const x=remote[id];let msgs;try{msgs=JSON.parse(x.msgs)}catch(e){return}
const l=chats.find(c=>String(c.id)===id);
if(!l){chats.push({id:Number(id)||id,title:x.title,msgs,updated:x.updated||0,n:msgs.length});changed=true}
else if((x.updated||0)>(l.updated||0)){l.title=x.title;l.msgs=msgs;l.updated=x.updated;l.n=msgs.length;changed=true}});
chats.forEach(c=>{const r=remote[String(c.id)];if(!r||(c.updated||0)>(r.updated||0))this.queue(c)});
if(changed){chats.sort((a,b)=>a.id-b.id);saveChats();renderList();if(!busy)renderChat()}
}catch(e){console.error(e);toast("No se pudo sincronizar")}}
});
