name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore stable debug key
        id: kc
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ego-debug-keystore-v1

      - name: Debug key & show SHA-1
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "### SHA-1 for Firebase" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save debug key
        if: steps.kc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ego-debug-keystore-v1

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          test -f www/index.html

      - name: Init Android project
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 jimp@0.22
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: Setup Firebase
        run: |
          if [ -f google-services.json ]; then
            npm install --no-audit --no-fund @capacitor-firebase/authentication@6 firebase@10
            cp google-services.json android/app/
            sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
            BUILD_GRADLE="android/build.gradle"
            if ! grep -q "com.google.gms:google-services" "$BUILD_GRADLE"; then
              sed -i 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.0"/' "$BUILD_GRADLE"
              sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' "$BUILD_GRADLE"
            fi
            APP_BUILD="android/app/build.gradle"
            if ! grep -q "com.google.gms.google-services" "$APP_BUILD"; then
              sed -i '/^apply plugin:/a apply plugin: "com.google.gms.google-services"' "$APP_BUILD"
            fi
            node -e "
              const fs=require('fs');
              const c=JSON.parse(fs.readFileSync('capacitor.config.json'));
              c.plugins=c.plugins||{};
              c.plugins.FirebaseAuthentication={skipNativeAuth:true,providers:['google.com']};
              fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));
            "
          fi
                - name: App icon
           continue-on-error:true.run:   
             node <<'EOF'
            const Jimp = require('jimp');
             (async () => {
            const src = await Jimp.read('icon.png');
            const res = 'android/app/src/main/res/';
            const c = Jimp.intToRGBA(src.getPixelColor(2, 2));
            const hex = '#' + [c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,'0')).join('');
            require('fs').writeFileSync(res+'values/ic_launcher_background.xml',
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<color name="ic_launcher_background">'+hex+'</color>\n</resources>');
            const sizes={mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};
            const fgSizes={mdpi:108,hdpi:162,xhdpi:216,xxhdpi:324,xxxhdpi:432};
            for(const d of Object.keys(sizes)){
              const s=sizes[d],f=fgSizes[d];
              await src.clone().cover(s,s).writeAsync(res+'mipmap-'+d+'/ic_launcher.png');
              await src.clone().cover(s,s).circle().writeAsync(res+'mipmap-'+d+'/ic_launcher_round.png');
              const inner=Math.round(f*0.66);
              const canvas=new Jimp(f,f,0x00000000);
              canvas.composite(src.clone().cover(inner,inner),Math.round((f-inner)/2),Math.round((f-inner)/2));
              await canvas.writeAsync(res+'mipmap-'+d+'/ic_launcher_foreground.png');
            }
          })();
          EOF

      - name: Add permissions
        run: |
          node <<'EOF'
          const fs=require('fs');
          const p='android/app/src/main/AndroidManifest.xml';
          let m=fs.readFileSync(p,'utf8');
          const perms=['ACCESS_NETWORK_STATE','ACCESS_WIFI_STATE','VIBRATE','RECORD_AUDIO','CAMERA','MODIFY_AUDIO_SETTINGS','READ_MEDIA_IMAGES','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','READ_CONTACTS','WRITE_CONTACTS','READ_CALENDAR','WRITE_CALENDAR','READ_SMS','SEND_SMS','RECEIVE_SMS','READ_PHONE_STATE','CALL_PHONE','POST_NOTIFICATIONS','BLUETOOTH_SCAN','BLUETOOTH_CONNECT','NEARBY_WIFI_DEVICES'];
          let add='';
          for(const n of perms) if(!m.includes('"android.permission.'+n+'"')) add+='    <uses-permission android:name="android.permission.'+n+'" />\n';
          if(!m.includes('READ_EXTERNAL_STORAGE')) add+='    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n';
          if(!m.includes('BLUETOOTH"')) add+='    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n';
          if(!m.includes('BLUETOOTH_ADMIN"')) add+='    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n';
          m=m.replace(/(<uses-permission.*INTERNET.*\/>)/,'$1\n'+add.trim());
          fs.writeFileSync(p,m);
          EOF
      - name: Splash logo
        continue-on-error: true
        run: |
          pip install --quiet --break-system-packages pillow
          python3 - <<'PYEOF'
          from PIL import Image,ImageDraw,ImageFont
          RES='android/app/src/main/res/'
          def hexc(h):return tuple(int(h.lstrip('#')[i:i+2],16) for i in (0,2,4))
          def make_text(t,s):
            f=ImageFont.load_default(size=s)
            d=ImageDraw.Draw(Image.new('RGBA',(1,1)))
            b=d.textbbox((0,0),t,font=f)
            w,h=b[2]-b[0],b[3]-b[1]
            img=Image.new('RGBA',(w+8,h+8))
            ImageDraw.Draw(img).text((4-b[0],4-b[1]),t,font=f,fill=hexc('#2b2621'))
            return img.crop(img.getbbox())
          for folder,colors in [('drawable-xxhdpi',('#2b2621','#c2693f')),('drawable-night-xxhdpi',('#ece6dd','#da8a5f'))]:
            t1=make_text('EGO',260);t2=make_text('AI',260)
            w=t1.width+70+t2.width;h=max(t1.height,t2.height)
            bg=Image.new('RGBA',(w,h),(0,0,0,0))
            bg.paste(t1,(0,(h-t1.height)//2))
            bg.paste(t2,(t1.width+70,(h-t2.height)//2))
            s=520;r=s/bg.width;new_h=int(bg.height*r)
            resized=bg.resize((s,new_h),Image.LANCZOS)
            final=Image.new('RGBA',(864,864),(0,0,0,0))
            final.paste(resized,((864-s)//2,(864-new_h)//2))
            final.save(f'{RES}{folder}/splash_logo.png')
          print('done')
          PYEOF

      - name: Splash & colors
        run: |
          node <<'EOF'
          const fs=require('fs'),res='android/app/src/main/res/',h='<?xml version="1.0" encoding="utf-8"?>\n';
          fs.writeFileSync(res+'values/colors.xml',h+'<resources><color name="app_bg">#faf7f2</color><color name="app_panel">#ffffff</color></resources>');
          fs.writeFileSync(res+'values-night/colors.xml',h+'<resources><color name="app_bg">#1a1714</color><color name="app_panel">#211d19</color></resources>');
          fs.writeFileSync(res+'values/bools.xml',h+'<resources><bool name="light_bars">true</bool></resources>');
          fs.writeFileSync(res+'values-night/bools.xml',h+'<resources><bool name="light_bars">false</bool></resources>');
          fs.writeFileSync(res+'drawable/splash.xml',h+'<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/app_bg"/></shape>');
          let st=fs.readFileSync(res+'values/styles.xml','utf8');
          st=st.replace(/<style name="AppTheme\.NoActionBarLaunch"[\s\S]*?<\/style>/,
            '<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen"><item name="windowSplashScreenBackground">@color/app_bg</item><item name="windowSplashScreenAnimatedIcon">@drawable/splash_logo</item><item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item></style>');
          fs.writeFileSync(res+'values/styles.xml',st);
          EOF

      - name: Native bridge
        run: |
          node <<'EOF'
          const fs=require('fs'),d='android/app/src/main/java/com/egoai/app/';
          fs.writeFileSync(d+'EgoNativePlugin.java',`package com.egoai.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.*;
          @CapacitorPlugin(name="EgoNative")
          public class EgoNativePlugin extends Plugin {
            private List<String> wanted(){
              List<String> l=new ArrayList<>();
              l.add(Manifest.permission.RECORD_AUDIO);
              l.add(Manifest.permission.CAMERA);
              return l;
            }
            @PluginMethod
            public void requestAll(final PluginCall call){
              List<String> missing=new ArrayList<>();
              for(String p:wanted())
                if(ContextCompat.checkSelfPermission(getContext(),p)!=PackageManager.PERMISSION_GRANTED)
                  missing.add(p);
              if(!missing.isEmpty())
                getActivity().requestPermissions(missing.toArray(new String[0]),7001);
              JSObject r=new JSObject();r.put("requested",missing.size());call.resolve(r);
            }
          }`);
          fs.writeFileSync(d+'MainActivity.java',`package com.egoai.app;
          import android.os.*;
          import android.webkit.WebView;
          import androidx.core.content.ContextCompat;
          import androidx.core.splashscreen.SplashScreen;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private volatile boolean ready=false;
            private final Handler h=new Handler(Looper.getMainLooper());
            @Override
            public void onCreate(Bundle s){
              SplashScreen.installSplashScreen(this).setKeepOnScreenCondition(()->!ready);
              registerPlugin(EgoNativePlugin.class);
              super.onCreate(s);
              if(getBridge()!=null&&getBridge().getWebView()!=null){
                WebView wv=getBridge().getWebView();
                wv.setBackgroundColor(ContextCompat.getColor(this, android.R.color.white));
                poll(wv);
              }else ready=true;
            }
            private void poll(final WebView wv){
              wv.evaluateJavascript("document.documentElement.getAttribute('data-ready')",v->{
                if("\"1\"".equals(v))ready=true;
                else h.postDelayed(()->poll(wv),30);
              });
            }
          }`);
          EOF

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EGO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
