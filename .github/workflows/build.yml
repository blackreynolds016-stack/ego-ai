name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 jimp@0.22
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          node -e "
            const Jimp = require('jimp');
            (async () => {
              const src = await Jimp.read('icon.png');
              const makeSquare = async (size) => {
                const img = src.clone();
                img.cover(size, size);
                img.background(0x000000FF);
                return img;
              };
              const icon = await makeSquare(1024);
              await icon.writeAsync('assets/icon.png');
              await icon.writeAsync('assets/icon-foreground.png');
              const splash = await makeSquare(2732);
              await splash.writeAsync('assets/splash.png');
              console.log('icon assets ready');
            })().catch(e => { console.error(e); process.exit(1); });
          "
          npx --yes @capacitor/assets generate --android

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EGO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
