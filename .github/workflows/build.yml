name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 jimp@0.22
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          node -e "
            const Jimp = require('jimp');
            (async () => {
              const src = await Jimp.read('icon.png');
              const sizes = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
              };
              for (const [dir, size] of Object.entries(sizes)) {
                const img = src.clone();
                img.cover(size, size);
                const base = 'android/app/src/main/res/' + dir;
                await img.writeAsync(base + '/ic_launcher.png');
                await img.writeAsync(base + '/ic_launcher_round.png');
                await img.writeAsync(base + '/ic_launcher_foreground.png');
              }
              console.log('icons written');
            })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "RECORD_AUDIO" "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EGO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
