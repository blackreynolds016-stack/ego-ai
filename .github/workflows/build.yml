name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore stable debug key
        id: kc
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ego-debug-keystore-v1

      - name: Debug key (create if missing) and show SHA-1
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "### Huella de firma (SHA-1) para Firebase" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save stable debug key
        if: steps.kc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ego-debug-keystore-v1

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          test -f www/index.html || { echo "ERROR: no se encontro index.html"; exit 1; }

      - name: Create Android project
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 jimp@0.22
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: Firebase setup
        run: |
          HAS=0
          if [ -f google-services.json ]; then HAS=1; fi
          if [ "$HAS" = "1" ]; then
            npm install --no-audit --no-fund @capacitor-firebase/authentication@6 firebase@10
            cp google-services.json android/app/google-services.json
            sed -i -E 's/minSdkVersion *= *2[0-2]/minSdkVersion = 23/' android/variables.gradle
            
            BUILD_GRADLE="android/build.gradle"
            if ! grep -q "com.google.gms:google-services" "$BUILD_GRADLE"; then
              sed -i 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.0"/' "$BUILD_GRADLE"
              sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' "$BUILD_GRADLE"
            fi
            
            APP_BUILD="android/app/build.gradle"
            if ! grep -q "apply plugin: \"com.google.gms.google-services\"" "$APP_BUILD"; then
              sed -i '/^apply plugin:/a apply plugin: "com.google.gms.google-services"' "$APP_BUILD"
            fi
            
            node <<'EOF'
            const fs = require('fs');
            const p = 'capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.plugins = c.plugins || {};
            c.plugins.FirebaseAuthentication = {
              skipNativeAuth: true,
              providers: ['google.com']
            };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log('Firebase configurado');
            EOF
          else
            echo "Sin google-services.json: inicio con Google desactivado"
          fi

      - name: App icon (adaptive + legacy)
        continue-on-error: true
        run: |
          node <<'EOF'
          const Jimp = require('jimp');
          (async () => {
            const src = await Jimp.read('icon.png');
            const res = 'android/app/src/main/res/';
            const c = Jimp.intToRGBA(src.getPixelColor(2, 2));
            const hex = '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
            require('fs').writeFileSync(
              res + 'values/ic_launcher_background.xml',
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + hex + '</color>\n</resources>\n'
            );
            const legacy = { 'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192 };
            const fg = { 'mipmap-mdpi': 108, 'mipmap-hdpi': 162, 'mipmap-xhdpi': 216, 'mipmap-xxhdpi': 324, 'mipmap-xxxhdpi': 432 };
            for (const dir of Object.keys(legacy)) {
              const s = legacy[dir];
              const sq = src.clone().cover(s, s);
              const round = src.clone().cover(s, s).circle();
              await sq.writeAsync(res + dir + '/ic_launcher.png');
              await round.writeAsync(res + dir + '/ic_launcher_round.png');
              const f = fg[dir];
              const inner = Math.round(f * 0.66);
              const canvas = new Jimp(f, f, 0x00000000);
              const icon = src.clone().cover(inner, inner);
              canvas.composite(icon, Math.round((f - inner) / 2), Math.round((f - inner) / 2));
              await canvas.writeAsync(res + dir + '/ic_launcher_foreground.png');
            }
            console.log('icons written, bg ' + hex);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
               - name: Add Android permissions
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(p, 'utf8');
          const names = [
            'ACCESS_NETWORK_STATE', 'ACCESS_WIFI_STATE', 'VIBRATE',
            'RECORD_AUDIO', 'CAMERA', 'MODIFY_AUDIO_SETTINGS', 'READ_MEDIA_IMAGES',
            'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
            'READ_CONTACTS', 'WRITE_CONTACTS',
            'READ_CALENDAR', 'WRITE_CALENDAR',
            'READ_SMS', 'SEND_SMS', 'RECEIVE_SMS',
            'READ_PHONE_STATE', 'CALL_PHONE',
            'POST_NOTIFICATIONS',
            'BLUETOOTH_SCAN', 'BLUETOOTH_CONNECT', 'NEARBY_WIFI_DEVICES'
          ];
          const has = n => m.includes('"android.permission.' + n + '"');
          let add = '';
          for (const n of names) if (!has(n)) add += '    <uses-permission android:name="android.permission.' + n + '" />\n';
          if (!has('READ_EXTERNAL_STORAGE')) add += '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n';
          if (!has('BLUETOOTH')) add += '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n';
          if (!has('BLUETOOTH_ADMIN')) add += '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n';
          for (const f of ['camera', 'microphone', 'bluetooth', 'telephony', 'location']) {
            if (!m.includes('"android.hardware.' + f + '"')) add += '    <uses-feature android:name="android.hardware.' + f + '" android:required="false" />\n';
          }
          const re = /(<uses-permission[^>]*android\.permission\.INTERNET"[^>]*\/>)/;
          if (!re.test(m)) throw new Error('No se encontro el permiso INTERNET');
          m = m.replace(re, (all) => all + '\n' + add.replace(/\n$/, ''));
          fs.writeFileSync(p, m);
          EOF

      - name: Splash logo
        continue-on-error: true
        run: |
          pip install --quiet --break-system-packages pillow
          python3 - <<'PYEOF'
          import os, sys
          from PIL import Image, ImageDraw, ImageFont
          RES = sys.argv[1] if len(sys.argv) > 1 else 'android/app/src/main/res/'
          def hexc(h, a=255):
              h = h.lstrip('#')
              return (int(h[0:2], 16), int(h[2:4], 16), int(h[4:6], 16), a)
          def text_img(parts, size, gap, stroke):
              font = ImageFont.load_default(size=size)
              d = ImageDraw.Draw(Image.new('RGBA', (1, 1)))
              boxes = [d.textbbox((0, 0), t, font=font, stroke_width=stroke) for t, _ in parts]
              w = sum(b[2] - b[0] for b in boxes) + gap * (len(parts) - 1)
              h = max(b[3] - b[1] for b in boxes)
              img = Image.new('RGBA', (w + 8, h + 8), (0, 0, 0, 0))
              dr = ImageDraw.Draw(img)
              x = 4
              for (t, col), b in zip(parts, boxes):
                  dr.text((x - b[0], 4 - b[1]), t, font=font, fill=col, stroke_width=stroke, stroke_fill=col)
                  x += (b[2] - b[0]) + gap
              return img.crop(img.getbbox())
          def fit(img, width):
              r = width / img.width
              return img.resize((width, max(1, round(img.height * r))), Image.LANCZOS)
          def center(img, size):
              c = Image.new('RGBA', size, (0, 0, 0, 0))
              c.alpha_composite(img, ((size[0] - img.width) // 2, (size[1] - img.height) // 2))
              return c
          modes = {
              'drawable-xxhdpi':       dict(text='#2b2621', accent='#c2693f', muted='#8a8178'),
              'drawable-night-xxhdpi': dict(text='#ece6dd', accent='#da8a5f', muted='#9c9186'),
          }
          for folder, c in modes.items():
              big = text_img([('EGO', hexc(c['text'])), ('AI', hexc(c['accent']))], size=260, gap=70, stroke=4)
              save(center(fit(big, 520), (864, 864)), folder, 'splash_logo.png')
          print('splash written')
          PYEOF

      - name: Instant splash + dark/light colors
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const res = 'android/app/src/main/res/';
          const write = (p, c) => { fs.mkdirSync(path.dirname(p), { recursive: true }); fs.writeFileSync(p, c); };
          const HEAD = '<?xml version="1.0" encoding="utf-8"?>\n';
          const cp = res + 'values/colors.xml';
          let colors = fs.existsSync(cp) ? fs.readFileSync(cp, 'utf8') : HEAD + '<resources>\n</resources>';
          colors = colors.replace('</resources>', '    <color name="app_bg">#faf7f2</color>\n    <color name="app_panel">#ffffff</color>\n</resources>');
          write(cp, colors);
          write(res + 'values-night/colors.xml', HEAD + '<resources>\n    <color name="app_bg">#1a1714</color>\n    <color name="app_panel">#211d19</color>\n</resources>\n');
          write(res + 'values/bools.xml', HEAD + '<resources>\n    <bool name="light_bars">true</bool>\n</resources>\n');
          write(res + 'values-night/bools.xml', HEAD + '<resources>\n    <bool name="light_bars">false</bool>\n</resources>\n');
          write(res + 'drawable/splash.xml', HEAD + '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="@color/app_bg" />\n</shape>\n');
          const stylesPath = res + 'values/styles.xml';
          let styles = fs.readFileSync(stylesPath, 'utf8');
          const launch = '<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n        <item name="windowSplashScreenBackground">@color/app_bg</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>\n        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>\n    </style>';
          styles = styles.replace(/<style name="AppTheme\.NoActionBarLaunch"[\s\S]*?<\/style>/, launch);
          fs.writeFileSync(stylesPath, styles);
          EOF

      - name: Native bridge
        run: |
          node <<'EOF'
          const fs = require('fs');
          const dir = 'android/app/src/main/java/com/egoai/app/';
          fs.writeFileSync(dir + 'EgoNativePlugin.java', `package com.egoai.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.ArrayList;
          import java.util.List;
          @CapacitorPlugin(name = "EgoNative")
          public class EgoNativePlugin extends Plugin {
              @PluginMethod
              public void requestAll(final PluginCall call) {
                  List<String> missing = new ArrayList<>();
                  String[] perms = {Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA};
                  for (String p : perms) if (ContextCompat.checkSelfPermission(getContext(), p) != 0) missing.add(p);
                  if (!missing.isEmpty()) getActivity().requestPermissions(missing.toArray(new String[0]), 7001);
                  JSObject r = new JSObject(); r.put("requested", missing.size()); call.resolve(r);
              }
          }`);
          fs.writeFileSync(dir + 'MainActivity.java', `package com.egoai.app;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.webkit.WebView;
          import androidx.core.content.ContextCompat;
          import androidx.core.splashscreen.SplashScreen;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              private volatile boolean ready = false;
              private final Handler handler = new Handler(Looper.getMainLooper());
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  SplashScreen.installSplashScreen(this).setKeepOnScreenCondition(() -> !ready);
                  registerPlugin(EgoNativePlugin.class);
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView wv = getBridge().getWebView();
                      wv.setBackgroundColor(ContextCompat.getColor(this, android.R.color.white));
                      poll(wv);
                  } else { ready = true; }
              }
              private void poll(final WebView wv) {
                  wv.evaluateJavascript("document.documentElement.getAttribute('data-ready')", v -> {
                      if ("\"1\"".equals(v) || SystemClock.uptimeMillis() - t0 > 4000) ready = true;
                      else handler.postDelayed(() -> poll(wv), 30);
                  });
              }
          }`);
          console.log('Native bridge ready');
          EOF

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EGO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
