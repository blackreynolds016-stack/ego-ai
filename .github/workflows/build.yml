name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure web assets are in www
        run: |
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then cp index.html www/index.html; fi
          ls -la www

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 jimp@0.22
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          node -e "
            const Jimp = require('jimp');
            (async () => {
              const src = await Jimp.read('icon.png');
              const sizes = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
              };
              for (const [dir, size] of Object.entries(sizes)) {
                const img = src.clone();
                img.cover(size, size);
                const base = 'android/app/src/main/res/' + dir;
                await img.writeAsync(base + '/ic_launcher.png');
                await img.writeAsync(base + '/ic_launcher_round.png');
                await img.writeAsync(base + '/ic_launcher_foreground.png');
              }
              console.log('icons written');
            })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "RECORD_AUDIO" "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Remove splash animation (instant open, solid bg color)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const BG = '#faf7f2';
            const res = 'android/app/src/main/res';

            // 1) Transparent drawable so no icon shows on the Android 12+ splash
            fs.mkdirSync(path.join(res, 'drawable'), { recursive: true });
            fs.writeFileSync(
              path.join(res, 'drawable', 'transparent.xml'),
              '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"rectangle\"><solid android:color=\"#00000000\"/></shape>'
            );

            // 2) app_bg color available in values (and values-night if present)
            const ensureColor = (dir) => {
              const p = path.join(res, dir, 'colors.xml');
              fs.mkdirSync(path.join(res, dir), { recursive: true });
              let c = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n</resources>';
              if (!c.includes('name=\"app_bg\"')) {
                c = c.replace('</resources>', '    <color name=\"app_bg\">' + BG + '</color>\n</resources>');
              }
              fs.writeFileSync(p, c);
            };
            ensureColor('values');
            if (fs.existsSync(path.join(res, 'values-night'))) ensureColor('values-night');

            // 3) Patch every themes.xml / styles.xml found (Capacitor 6 uses themes.xml)
            const patch = (file) => {
              if (!fs.existsSync(file)) return false;
              let s = fs.readFileSync(file, 'utf8');
              s = s.replace(/<item name=\"android:windowSplashScreenBackground\">[^<]*<\/item>\s*/g, '');
              s = s.replace(/<item name=\"android:windowSplashScreenAnimatedIcon\">[^<]*<\/item>\s*/g, '');
              s = s.replace(/<item name=\"android:windowSplashScreenAnimationDuration\">[^<]*<\/item>\s*/g, '');
              s = s.replace(/<item name=\"android:windowBackground\">[^<]*<\/item>\s*/g, '');
              const launchItems = '\n        <item name=\"android:windowSplashScreenBackground\">@color/app_bg</item>\n        <item name=\"android:windowSplashScreenAnimatedIcon\">@drawable/transparent</item>\n        <item name=\"android:windowSplashScreenAnimationDuration\">0</item>\n        <item name=\"android:windowBackground\">@color/app_bg</item>';
              if (/<style name=\"AppTheme\.NoActionBarLaunch\"[^>]*>/.test(s)) {
                s = s.replace(/(<style name=\"AppTheme\.NoActionBarLaunch\"[^>]*>)/, '\$1' + launchItems);
              }
              if (/<style name=\"AppTheme\"[^>]*>/.test(s)) {
                s = s.replace(/(<style name=\"AppTheme\"[^>]*>)/, '\$1\n        <item name=\"android:windowBackground\">@color/app_bg</item>');
              }
              fs.writeFileSync(file, s);
              return true;
            };
            let patched = false;
            for (const dir of ['values', 'values-night', 'values-v31', 'values-night-v31']) {
              if (patch(path.join(res, dir, 'themes.xml'))) patched = true;
              if (patch(path.join(res, dir, 'styles.xml'))) patched = true;
            }
            if (!patched) { console.warn('WARNING: no themes.xml/styles.xml found to patch.'); }
            else { console.log('Splash patched: transparent icon, animationDuration=0, bg=' + BG); }
          "

      - name: Match WebView background to app color
        continue-on-error: true
        run: |
          node -e "
            const fs = require('fs');
            const path = 'capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            cfg.backgroundColor = '#faf7f2';
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
            console.log('capacitor.config.json backgroundColor set');
          "

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EGO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
