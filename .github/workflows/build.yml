      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          test -f www/index.html || { echo "ERROR: no se encontro index.html (ni en la raiz ni en www/)"; exit 1; }

      - name: Create Android project
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 jimp@0.22
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: App icon (adaptive + legacy)
        continue-on-error: true
        run: |
          node <<'EOF'
          const Jimp = require('jimp');
          (async () => {
            const src = await Jimp.read('icon.png');
            const res = 'android/app/src/main/res/';

            // Color de fondo del icono adaptativo = color de la esquina del icon.png
            const c = Jimp.intToRGBA(src.getPixelColor(2, 2));
            const hex = '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
            require('fs').writeFileSync(
              res + 'values/ic_launcher_background.xml',
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + hex + '</color>\n</resources>\n'
            );

            // Iconos clasicos (Android < 8): mipmap 48..192
            const legacy = { 'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192 };
            // Capa frontal del icono adaptativo: lienzo 108dp, icono al 60% (cabe completo en mascara circular)
            const fg = { 'mipmap-mdpi': 108, 'mipmap-hdpi': 162, 'mipmap-xhdpi': 216, 'mipmap-xxhdpi': 324, 'mipmap-xxxhdpi': 432 };

            for (const dir of Object.keys(legacy)) {
              const s = legacy[dir];
              const sq = src.clone().cover(s, s);
              const round = src.clone().cover(s, s).circle();
              await sq.writeAsync(res + dir + '/ic_launcher.png');
              await round.writeAsync(res + dir + '/ic_launcher_round.png');

              const f = fg[dir];
              const inner = Math.round(f * 0.60);
              const canvas = new Jimp(f, f, 0x00000000);
              const icon = src.clone().cover(inner, inner);
              canvas.composite(icon, Math.round((f - inner) / 2), Math.round((f - inner) / 2));
              await canvas.writeAsync(res + dir + '/ic_launcher_foreground.png');
            }
            console.log('icons written, bg ' + hex);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Add Android permissions
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(p, 'utf8');
          const names = [
            'ACCESS_NETWORK_STATE', 'ACCESS_WIFI_STATE', 'VIBRATE',
            'RECORD_AUDIO', 'CAMERA', 'MODIFY_AUDIO_SETTINGS', 'READ_MEDIA_IMAGES',
            'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
            'READ_CONTACTS', 'WRITE_CONTACTS',
            'READ_CALENDAR', 'WRITE_CALENDAR',
            'READ_SMS', 'SEND_SMS', 'RECEIVE_SMS',
            'READ_PHONE_STATE', 'CALL_PHONE',
            'POST_NOTIFICATIONS',
            'BLUETOOTH_SCAN', 'BLUETOOTH_CONNECT', 'NEARBY_WIFI_DEVICES'
          ];
          const has = n => m.includes('"android.permission.' + n + '"');
          let add = '';
          for (const n of names) if (!has(n)) add += '    <uses-permission android:name="android.permission.' + n + '" />\n';
          if (!has('READ_EXTERNAL_STORAGE')) add += '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n';
          if (!has('BLUETOOTH')) add += '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n';
          if (!has('BLUETOOTH_ADMIN')) add += '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n';
          for (const f of ['camera', 'microphone', 'bluetooth', 'telephony', 'location']) {
            if (!m.includes('"android.hardware.' + f + '"')) add += '    <uses-feature android:name="android.hardware.' + f + '" android:required="false" />\n';
          }
          const re = /(<uses-permission[^>]*android\.permission\.INTERNET"[^>]*\/>)/;
          if (!re.test(m)) throw new Error('No se encontro el permiso INTERNET en el manifest');
          m = m.replace(re, (all) => all + '\n' + add.replace(/\n$/, ''));
          fs.writeFileSync(p, m);
          console.log(m);
          EOF
