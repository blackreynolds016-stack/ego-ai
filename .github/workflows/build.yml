name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          convert icon.png -resize 1024x1024^ -gravity center -extent 1024x1024 -background black -alpha remove -colorspace sRGB assets/icon.png
          cp assets/icon.png assets/icon-foreground.png
          convert icon.png -resize 2732x2732 -gravity center -background black -extent 2732x2732 -colorspace sRGB assets/splash.png
          npx --yes @capacitor/assets generate --android

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EGO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
