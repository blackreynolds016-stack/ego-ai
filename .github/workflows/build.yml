name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          test -f www/index.html || { echo "ERROR: no se encontro index.html (ni en la raiz ni en www/)"; exit 1; }

      - name: Create Android project
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 jimp@0.22
          npx cap init "EGO AI" com.egoai.app --web-dir=www
          npx cap add android

      - name: App icon (adaptive + legacy)
        continue-on-error: true
        run: |
          node <<'EOF'
          const Jimp = require('jimp');
          (async () => {
            const src = await Jimp.read('icon.png');
            const res = 'android/app/src/main/res/';

            // Color de fondo del icono adaptativo = color de la esquina del icon.png
            const c = Jimp.intToRGBA(src.getPixelColor(2, 2));
            const hex = '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
            require('fs').writeFileSync(
              res + 'values/ic_launcher_background.xml',
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + hex + '</color>\n</resources>\n'
            );

            // Iconos clasicos (Android < 8): mipmap 48..192
            const legacy = { 'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192 };
            // Capa frontal del icono adaptativo: lienzo 108dp, icono al 66% (zona segura)
            const fg = { 'mipmap-mdpi': 108, 'mipmap-hdpi': 162, 'mipmap-xhdpi': 216, 'mipmap-xxhdpi': 324, 'mipmap-xxxhdpi': 432 };

            for (const dir of Object.keys(legacy)) {
              const s = legacy[dir];
              const sq = src.clone().cover(s, s);
              const round = src.clone().cover(s, s).circle();
              await sq.writeAsync(res + dir + '/ic_launcher.png');
              await round.writeAsync(res + dir + '/ic_launcher_round.png');

              const f = fg[dir];
              const inner = Math.round(f * 0.66);
              const canvas = new Jimp(f, f, 0x00000000);
              const icon = src.clone().cover(inner, inner);
              canvas.composite(icon, Math.round((f - inner) / 2), Math.round((f - inner) / 2));
              await canvas.writeAsync(res + dir + '/ic_launcher_foreground.png');
            }
            console.log('icons written, bg ' + hex);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "RECORD_AUDIO" "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$MANIFEST"
          grep -q "RECORD_AUDIO" "$MANIFEST" || { echo "ERROR: permisos no agregados"; exit 1; }

      - name: Instant splash (solid color, no icon, no animation)
        continue-on-error: true
        run: |
          node <<'EOF'
          const fs = require('fs');
          const BG = '#faf7f2';
          const res = 'android/app/src/main/res/';

          // 1) color de fondo
          const colorsPath = res + 'values/colors.xml';
          let colors = fs.existsSync(colorsPath)
            ? fs.readFileSync(colorsPath, 'utf8')
            : '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>';
          colors = colors.replace(/\s*<color name="app_bg">[^<]*<\/color>/, '');
          colors = colors.replace('</resources>', '    <color name="app_bg">' + BG + '</color>\n</resources>');
          fs.writeFileSync(colorsPath, colors);

          // 2) "icono" de splash totalmente transparente
          fs.mkdirSync(res + 'drawable', { recursive: true });
          fs.writeFileSync(res + 'drawable/splash_empty.xml',
            '<?xml version="1.0" encoding="utf-8"?>\n' +
            '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n' +
            '    <solid android:color="#00000000" />\n' +
            '    <size android:width="1dp" android:height="1dp" />\n' +
            '</shape>\n');

          // 2b) quitar el logo de Capacitor (drawable/splash) dejando solo color
          for (const d of fs.readdirSync(res)) {
            if (d.startsWith('drawable')) {
              const p = res + d + '/splash.png';
              if (fs.existsSync(p)) fs.unlinkSync(p);
            }
          }
          fs.writeFileSync(res + 'drawable/splash.xml',
            '<?xml version="1.0" encoding="utf-8"?>\n' +
            '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n' +
            '    <solid android:color="@color/app_bg" />\n' +
            '</shape>\n');

          // 3) tema de arranque: fondo liso, sin icono, duracion 0
          const stylesPath = res + 'values/styles.xml';
          let styles = fs.readFileSync(stylesPath, 'utf8');
          const launch =
            '<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n' +
            '        <item name="windowSplashScreenBackground">@color/app_bg</item>\n' +
            '        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_empty</item>\n' +
            '        <item name="windowSplashScreenAnimationDuration">0</item>\n' +
            '        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>\n' +
            '        <item name="android:windowBackground">@color/app_bg</item>\n' +
            '        <item name="android:background">@color/app_bg</item>\n' +
            '    </style>';
          if (!/<style name="AppTheme\.NoActionBarLaunch"/.test(styles)) throw new Error('style NoActionBarLaunch no encontrado');
          styles = styles.replace(/<style name="AppTheme\.NoActionBarLaunch"[\s\S]*?<\/style>/, launch);

          // 4) fondo de ventana en los temas normales (evita parpadeo blanco)
          for (const name of ['AppTheme.NoActionBar', 'AppTheme']) {
            const re = new RegExp('(<style name="' + name.replace('.', '\\.') + '"[^>]*>)');
            styles = styles.replace(re, '$1\n        <item name="android:windowBackground">@color/app_bg</item>');
          }
          fs.writeFileSync(stylesPath, styles);
          console.log(styles);
          EOF

      - name: Match WebView background to app color
        continue-on-error: true
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'capacitor.config.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.backgroundColor = '#faf7f2';
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          console.log('capacitor.config.json backgroundColor set');
          EOF

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EGO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
